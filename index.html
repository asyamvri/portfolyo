<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>g.unes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }

  .phone {
    width: 100%; max-width: 414px; height: 100%; max-height: 896px;
    position: relative; overflow: hidden; color: white; background: #111;
  }
  @media (min-width: 450px) { .phone { border-radius: 44px; border: 8px solid #1f1f1f; height: 92vh; } }

  .wallpaper { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; }
  .wallpaper-dim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.25); z-index: 1; pointer-events: none; }

  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 38px; padding: 12px 24px 0;
    display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; z-index: 50; pointer-events: none;
  }

  /* 1. KİLİT EKRANI (Başlangıçta gizli, kilitle deyince gelir) */
  .lock-screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; align-items: center; padding: 70px 20px 40px;
    transition: transform 0.4s ease, opacity 0.3s ease; z-index: 25; cursor: pointer;
  }
  .lock-screen.hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }

  .time-box { text-align: center; text-shadow: 0 2px 15px rgba(0,0,0,0.65); z-index: 2; }
  .date { font-size: 18px; font-weight: 500; opacity: 0.95; margin-bottom: 4px; }
  .clock { font-size: 80px; font-weight: 700; letter-spacing: -2px; line-height: 1; }

  .unlock-hint { text-align: center; z-index: 2; padding: 15px 30px; }
  .unlock-hint p { font-size: 15px; font-weight: 600; margin-bottom: 12px; text-shadow: 0 2px 10px rgba(0,0,0,0.85); animation: pulse 2s infinite; }
  .home-bar { width: 135px; height: 5px; background: white; border-radius: 10px; margin: 0 auto; box-shadow: 0 1px 5px rgba(0,0,0,0.5); }

  /* 2. PAROLA EKRANI (Doğrudan Açık Başlar) */
  .passcode-screen {
    position: absolute; inset: 0; background: rgba(10, 10, 15, 0.68);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 35;
  }
  .passcode-screen.active { opacity: 1; pointer-events: auto; }
  .passcode-title { font-size: 19px; font-weight: 500; margin-bottom: 16px; }

  .dots { display: flex; gap: 16px; margin-bottom: 36px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid white; transition: 0.15s; }
  .dot.filled { background: white; }
  .dots.shake { animation: shake 0.32s; }

  .keypad { display: grid; grid-template-columns: repeat(3, 74px); gap: 18px; }
  .key {
    width: 74px; height: 74px; border-radius: 50%; background: rgba(255,255,255,0.2);
    display: flex; justify-content: center; align-items: center; font-size: 28px;
    cursor: pointer; transition: background 0.15s;
  }
  .key:active { background: rgba(255,255,255,0.48); }
  .key.empty { background: transparent; pointer-events: none; }
  .cancel-btn { margin-top: 32px; font-size: 16px; cursor: pointer; opacity: 0.9; padding: 10px 20px; }

  /* 3. ANA EKRAN */
  .home-screen {
    position: absolute; inset: 0; padding: 60px 24px 28px; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .apps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 14px; margin-top: 10px; }
  .app { display: flex; flex-direction: column; align-items: center; cursor: pointer; gap: 6px; }
  .app-icon {
    width: 60px; height: 60px; border-radius: 15px; display: flex;
    justify-content: center; align-items: center; font-size: 28px; font-weight: bold;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4); transition: transform 0.15s;
  }
  .app:active .app-icon { transform: scale(0.92); }
  .app span { font-size: 11.5px; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.9); text-align: center; }

  .dock {
    background: rgba(255, 255, 255, 0.24); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 26px; padding: 12px 16px; display: flex; justify-content: space-around; align-items: center;
  }

  /* UYGULAMA PENCERELERİ */
  .app-window {
    position: absolute; inset: 0; background: #000; z-index: 45;
    display: flex; flex-direction: column; transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .app-window.open { transform: translateY(0); }

  .app-header {
    padding: 46px 16px 12px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.12); font-weight: 600; font-size: 16px;
  }
  .back-btn { color: #3897f0; font-size: 15px; cursor: pointer; font-weight: 500; padding: 4px 8px; }
  .app-body { flex: 1; overflow-y: auto; padding: 16px; }

  .ig-profile { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
  .ig-avatar { width: 78px; height: 78px; border-radius: 50%; object-fit: cover; border: 2px solid #e1306c; background: #222; }
  .ig-stats { display: flex; gap: 18px; text-align: center; flex: 1; justify-content: space-around; }
  .ig-stats div strong { display: block; font-size: 17px; }
  .ig-stats div span { font-size: 12px; color: #aaa; }
  .ig-bio { font-size: 14px; margin-bottom: 16px; line-height: 1.4; }
  .ig-btn { display: block; width: 100%; text-align: center; background: #262626; color: white; padding: 9px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 18px; }
  .ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .ig-post { aspect-ratio: 1; background: #1a1a1a; object-fit: cover; width: 100%; }

  .sp-bg { background: linear-gradient(180deg, #1db95455 0%, #121212 45%); }
  .sp-center { text-align: center; padding-top: 20px; }
  .sp-avatar { width: 135px; height: 135px; border-radius: 50%; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.6); margin-bottom: 16px; background: #222; }
  .sp-name { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .sp-desc { font-size: 14px; color: #b3b3b3; background: rgba(255,255,255,0.08); padding: 10px 16px; border-radius: 12px; display: inline-block; margin-bottom: 24px; }
  .sp-track { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.07); padding: 12px; border-radius: 10px; text-align: left; }

  .x-tweet { display: flex; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #222; }
  .x-avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: #222; }
  .x-content { flex: 1; }
  .x-user { font-weight: 700; font-size: 15px; }
  .x-handle { color: #71767b; font-size: 13px; margin-left: 4px; }
  .x-text { margin-top: 6px; font-size: 15px; line-height: 1.45; }
  .x-actions { display: flex; justify-content: space-between; color: #71767b; font-size: 13px; margin-top: 12px; max-width: 240px; }

  .wp-bg { background: #0b141a; }
  .wp-item { display: flex; align-items: center; gap: 12px; padding: 12px 6px; border-bottom: 1px solid #1f2c34; cursor: pointer; }
  .wp-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #2a3942; }
  .wp-info { flex: 1; }
  .wp-name { font-weight: 600; font-size: 16px; margin-bottom: 3px; }
  .wp-last { font-size: 13px; color: #8696a0; }
  .wp-chat { display: none; flex-direction: column; height: 100%; }
  .wp-chat.active { display: flex; }
  .wp-messages { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #0b141a; }
  .msg { background: #202c33; padding: 9px 13px; border-radius: 12px; border-top-left-radius: 2px; max-width: 80%; font-size: 14.5px; align-self: flex-start; line-height: 1.35; }
  .msg-sender { font-size: 11.5px; color: #53bdeb; font-weight: 600; margin-bottom: 2px; }
  .msg-time { font-size: 10px; color: #8696a0; text-align: right; margin-top: 3px; }

  .cal-bg { background: #1c1c1e; }
  .cal-month { margin-bottom: 24px; background: #2c2c2e; padding: 14px; border-radius: 16px; }
  .cal-title { font-size: 18px; font-weight: 700; color: #ff453a; margin-bottom: 12px; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 8px 4px; font-size: 14px; }
  .cal-head { color: #8e8e93; font-size: 11px; font-weight: 600; }
  .cal-day { padding: 7px 0; border-radius: 50%; }
  .cal-marked { background: #ff453a; color: white; font-weight: 700; box-shadow: 0 2px 10px rgba(255,69,58,0.5); }

  .home-indicator-bottom { padding: 12px 0 16px; display: flex; justify-content: center; background: inherit; cursor: pointer; }

  @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
</style>
</head>
<body>
<div class="phone">
  <img src="https://ibb.co" class="wallpaper" alt="">
  <div class="wallpaper-dim"></div>

  <div class="status-bar"><span id="topClock">09:41</span><span>5G 🔋</span></div>

  <div class="lock-screen hidden" id="lockScreen" onclick="openPasscode()">
    <div class="time-box"><div class="date" id="dateText">22 Kasım Pazar</div><div class="clock" id="clockText">09:41</div></div>
    <div class="unlock-hint"><p>Açmak için dokun</p><div class="home-bar"></div></div>
  </div>
